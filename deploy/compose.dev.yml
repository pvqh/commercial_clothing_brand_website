services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - "${CATALOG_DB_PORT:-5432}:5432"
    volumes:
      - catalog-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog"]
      interval: 5s
      retries: 10

volumes:
  catalog-db:
